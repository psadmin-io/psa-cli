name: Bug report
description: Report a defect in psa-cli
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the command you ran.
      placeholder: |
        I ran `psa dpk apply --summary` and ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `psa config setup --yes`
        2. Run `psa ...`
        3. Observe ...
    validations:
      required: true

  - type: input
    id: psa-version
    attributes:
      label: psa-cli version
      description: Output of `psa --version`
      placeholder: psa version 0.3.0
    validations:
      required: true

  - type: input
    id: peopletools
    attributes:
      label: PeopleTools version
      placeholder: 8.62.04
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Oracle Linux 9.3
    validations:
      required: false

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: Python 3.11.7
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant CLI output. Run with `-v` for verbose mode.
      render: shell
    validations:
      required: false
