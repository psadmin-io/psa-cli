site_name: psa-cli
site_description: A unified command-line tool for PeopleSoft administration
site_url: https://psadmin-io.github.io/psa-cli/
repo_url: https://github.com/psadmin-io/psa-cli
repo_name: psadmin-io/psa-cli
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 psadmin.io

theme:
  name: material
  logo: assets/io_full_400.png
  favicon: assets/io_blue_80.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/psadmin-io/psa-cli
    - icon: fontawesome/solid/globe
      link: https://psadmin.io

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Commands:
      - Overview: commands/index.md
      - domain: commands/domain.md
      - dpk: commands/dpk.md
      - config: commands/config.md
      - kit: commands/kit.md
  - DPK workflow:
      - Provisioning workflow: dpk/provisioning-workflow.md
      - Validation quickstart: dpk/validation-quickstart.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
